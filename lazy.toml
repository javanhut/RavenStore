# ImLazy configuration file

[settings]
default = "build"

[variables]
app_id = "com.ravenstore.Raven"
binary = "raven-store"
prefix = "/usr/local"
bindir = "{{prefix}}/bin"
datadir = "{{prefix}}/share"
icondir = "{{datadir}}/icons/hicolor/scalable/apps"
target = "target/release/{{binary}}"

[commands]

[commands.build]
desc = "Build release binary"
alias = ["b"]
run = ["cargo build --locked --release"]

[commands.run]
desc = "Run the store from the build tree"
run = ["cargo run --release"]

[commands.test]
desc = "Run all tests"
alias = ["t"]
run = ["cargo test --locked"]

[commands.check]
desc = "Run formatting, Clippy, and the test suite"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked",
]

[commands.install]
desc = "Install raven-store and its desktop entry (may need sudo)"
dep = ["build"]
run = [
  "install -Dm755 {{target}} {{bindir}}/{{binary}}",
  "install -Dm644 data/{{app_id}}.desktop {{datadir}}/applications/{{app_id}}.desktop",
  "install -Dm644 data/{{app_id}}.metainfo.xml {{datadir}}/metainfo/{{app_id}}.metainfo.xml",
  "install -Dm644 data/icons/hicolor/scalable/apps/{{app_id}}.svg {{icondir}}/{{app_id}}.svg",
  "sh -c 'command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q {{datadir}}/applications || true'",
  "sh -c 'command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -qtf {{datadir}}/icons/hicolor || true'",
]

[commands.uninstall]
desc = "Remove raven-store"
run = [
  "rm -f {{bindir}}/{{binary}}",
  "rm -f {{datadir}}/applications/{{app_id}}.desktop",
  "rm -f {{datadir}}/metainfo/{{app_id}}.metainfo.xml",
  "rm -f {{icondir}}/{{app_id}}.svg",
]

[commands.clean]
desc = "Clean build artifacts"
run = ["cargo clean"]
